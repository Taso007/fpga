<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-label="C5G interface input storage feeds a purely combinational CLU and display decoders">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#346280"/></marker></defs>
<rect width="1100" height="390" rx="12" fill="#f5f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17364e">
<text x="35" y="38" font-size="22" font-weight="bold">Board input storage surrounds a combinational CLU</text>
<rect x="28" y="115" width="180" height="165" rx="9" fill="#e5edf7" stroke="#8aa3ba"/>
<text x="48" y="147" font-size="18" font-weight="bold">C5G controls</text>
<text x="48" y="180" font-size="16">SW7:0 = data</text><text x="48" y="207" font-size="16">KEY0/1/2 = load</text>
<text x="48" y="234" font-size="16">KEY3 = reset</text><text x="48" y="261" font-size="16">50 MHz clock</text>
<rect x="260" y="100" width="235" height="195" rx="9" fill="#e5edf7" stroke="#8aa3ba"/>
<text x="280" y="133" font-size="18" font-weight="bold">Board wrapper</text>
<text x="280" y="167" font-size="16">2-stage synchronizers</text><text x="280" y="196" font-size="16">Button edge detection</text>
<text x="280" y="225" font-size="16">A, B, OP input registers</text><text x="280" y="270" font-size="14">Registers are outside the CLU</text>
<rect x="558" y="100" width="220" height="195" rx="9" fill="#def3eb" stroke="#2d8c79" stroke-width="2"/>
<text x="580" y="133" font-size="18" font-weight="bold">CLU (clu.vhd)</text>
<text x="580" y="167" font-size="16">Arithmetic / bit logic</text><text x="580" y="196" font-size="16">Compare / parity / ROL</text>
<text x="580" y="225" font-size="16">R and Z, C, N, LT</text><text x="580" y="270" font-size="14">No clock, registers or latches</text>
<rect x="840" y="100" width="230" height="195" rx="9" fill="#e5edf7" stroke="#8aa3ba"/>
<text x="860" y="133" font-size="18" font-weight="bold">Result indicators</text>
<text x="860" y="167" font-size="16">LEDR7:0 = result bits</text><text x="860" y="196" font-size="16">LEDG3:0 = flags</text>
<text x="860" y="225" font-size="16">HEX1:0 = result hex</text><text x="860" y="270" font-size="14">Combinational hex decoders</text>
<text x="280" y="352" font-size="15">SW9:8 selects A / B / live switches / OP on HEX3:2 through a separate display multiplexer.</text>
</g>
<g fill="none" stroke="#346280" stroke-width="2.5" marker-end="url(#arrow)"><path d="M208,192 H253"/><path d="M495,192 H551"/><path d="M778,192 H833"/></g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#346280"><text x="505" y="177">8/8/3</text><text x="789" y="177">8 + 4</text></g>
</svg>
